name: Prototype checks

on:
  pull_request:
  push:
    branches: [main, design/capture-state-prototype]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prototype:
    name: Synthetic prototype and reference checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Capture and recovery behavior
        run: node --test docs/ux/prototype/checks/capture.cjs
      - name: Navigation and circle behavior
        run: node docs/ux/prototype/checks/flows.cjs
      - name: Design tokens and reference integrity
        run: node docs/ux/prototype/checks/design.cjs
      - name: Capture proposal contract and fixtures
        run: node docs/product/capture-v2.2/check.cjs
      - name: Python runtime
        run: python3 --version
      - name: Synthetic capture core and proposal gate
        run: python3 -m unittest discover -s experiments/capture_core -p 'test_*.py'
      - name: Synthetic five-proposal walkthrough
        run: python3 experiments/capture_core/demo.py
