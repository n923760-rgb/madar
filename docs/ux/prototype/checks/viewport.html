<!doctype html><html lang="en"><meta charset="utf-8"><title>MADAR local responsive viewport check</title><style>body{margin:12px;font:16px sans-serif;background:#ddd}label,select{padding:8px}iframe{display:block;border:0;margin:12px 0;background:#081b22}</style><label for="viewport">Viewport</label><select id="viewport"><option>320x480</option><option>390x560</option><option>740x360</option><option>844x390</option><option>768x700</option></select><iframe title="MADAR test viewport" id="app" src="../index.html" width="320" height="480"></iframe><script>document.getElementById('viewport').onchange=e=>{const [w,h]=e.target.value.split('x');document.getElementById('app').width=w;document.getElementById('app').height=h}</script></html>
